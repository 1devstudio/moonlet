[package]
name = "moonlet-app"
description = "moonlet desktop app (thin client of moonletd)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "moonlet_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
moonlet-proto.workspace = true
moonlet-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
libc.workspace = true
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# In-app updates (X35).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# The newest Claude Code from npm (X36). The updater plugin already builds
# both, with these features.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Embedded WebDriver server for the e2e tests (X12). Never in normal builds:
# it exposes the window over HTTP.
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
tauri-plugin-wdio = { version = "1", optional = true }

[features]
e2e = ["dep:tauri-plugin-wdio-webdriver", "dep:tauri-plugin-wdio"]

[dev-dependencies]
tempfile.workspace = true

[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri", "apps/mobile/src-tauri"]
default-members = ["crates/*", "apps/desktop/src-tauri", "apps/mobile/src-tauri"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.34"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/1devstudio/moonlet"

[workspace.dependencies]
moonlet-proto = { path = "crates/moonlet-proto" }
moonlet-core = { path = "crates/moonlet-core" }
moonlet-link = { path = "crates/moonlet-link" }
moonlet-trackers = { path = "crates/moonlet-trackers" }
moonlet-cloud = { path = "crates/moonlet-cloud" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
nix = { version = "0.31", features = ["term", "process", "signal", "fs", "ioctl", "socket", "uio", "user", "hostname"] }
libc = "0.2"
vt100 = "0.16"
ignore = "0.4"
notify = "8"
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"

# Debug builds keep file and line numbers for backtraces in our own crates and
# drop the rest of the debug info, which is most of each worktree's target/.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# vt100 with a count of rows pushed into the scrollback (see vendor/vt100/PATCHES.md).
[patch.crates-io]
vt100 = { path = "vendor/vt100" }

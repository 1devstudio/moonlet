[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]
default-members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.11"
edition = "2024"
license = "UNLICENSED"
repository = "https://github.com/1devstudio/jaunt"

[workspace.dependencies]
moonlet-proto = { path = "crates/moonlet-proto" }
moonlet-core = { path = "crates/moonlet-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
nix = { version = "0.31", features = ["term", "process", "signal", "fs", "ioctl", "socket", "uio", "user", "hostname"] }
libc = "0.2"
vt100 = "0.16"
ignore = "0.4"
notify = "8"
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[package]
name = "moonletd"
description = "moonlet session daemon: owns every PTY so agents outlive the app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "moonletd"
path = "src/main.rs"

[dependencies]
moonlet-proto.workspace = true
moonlet-core.workspace = true
moonlet-link.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
nix = { workspace = true, features = ["net"] }
libc.workspace = true
dirs.workspace = true
sha2 = "0.10"
uuid.workspace = true
qrcodegen = "1.8"

[dev-dependencies]
tempfile.workspace = true

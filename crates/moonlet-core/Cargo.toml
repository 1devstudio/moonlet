[package]
name = "moonlet-core"
description = "Sessions, terminal state, agent state, git and files for moonletd"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
moonlet-proto.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
nix.workspace = true
libc.workspace = true
vt100.workspace = true
ignore.workspace = true
notify.workspace = true
dirs.workspace = true
uuid.workspace = true
toml = "0.9"
toml_edit = "0.23"
regex = "1"
# Design system checks (X64): element locations and attribute rewrites that
# keep the rest of the file as it is.
lol_html = "3"
# Where a stylesheet's comments are, read as a browser reads them; the
# version lol_html already builds.
cssparser = "0.36"
# Writes in a design system's folder through directory handles, never
# through a symlink out of it, with no check-then-use gap (X64).
cap-std = "4"
sha2 = "0.10"

[dev-dependencies]
tempfile.workspace = true

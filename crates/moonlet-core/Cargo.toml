[package]
name = "moonlet-core"
description = "Sessions, terminal state, agent state, git and files for moonletd"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
moonlet-proto.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
nix.workspace = true
libc.workspace = true
vt100.workspace = true
ignore.workspace = true
notify.workspace = true
dirs.workspace = true
uuid.workspace = true
toml = "0.9"
toml_edit = "0.23"
regex = "1"
# Design system checks (X64): element locations and attribute rewrites that
# keep the rest of the file as it is.
lol_html = "3"
# Where a stylesheet's comments are, read as a browser reads them; the
# version lol_html already builds.
cssparser = "0.36"
# Where a design's page that did not load first goes wrong as HTML (X65):
# lol_html reports no parse errors; html5ever's tokenizer does, by line.
html5ever = "0.39"
# Writes in a design system's folder through directory handles, never
# through a symlink out of it, with no check-then-use gap (X64).
cap-std = "4"
# Reads a sign-in URL's redirect_uri (X75); already in the lockfile.
url = "2.5"
sha1 = "0.10"
# A design's page downloaded as one HTML file (X99): its images and fonts
# as data: URLs; already in the lockfile.
base64 = "0.22"
sha2 = "0.10"

# Delete in the Files tab moves to the Trash (X98); already built for the app.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSString", "NSError"] }

[dev-dependencies]
tempfile.workspace = true

# Builds moonlet for Apple Silicon, signs it with the Developer ID, has Apple
# notarize it (X3), signs the update archive and publishes a GitHub release
# with latest.json, which installed apps check for (X35).
#
# The Apple secrets live in the `release` environment, which only `v*` tags
# may use. Setting them up is in docs/release.md.
#
# Release: bump the version, merge, then push a tag that matches it:
#   git tag v0.1.15 origin/main && git push origin v0.1.15
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Every action is pinned to a commit: the updater key and the Developer ID
# below can ship code to every installed app, so no action may change under a
# moved tag.
jobs:
  macos:
    runs-on: macos-14
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Tag matches the app version
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version $version"
            exit 1
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-unknown-linux-musl,x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Remote helpers (static Linux moonletd and moonlet)
        run: |
          brew install zig
          cargo install cargo-zigbuild --locked
          scripts/build-remote.sh

      - run: pnpm install --frozen-lockfile

      # A missing secret would otherwise ship a build that is not notarized.
      - name: Apple signing secrets are set
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::secret $name is not set in the release environment"
              exit 1
            fi
          done

      # notarytool reads the App Store Connect API key from a file.
      - name: Notarization key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      # Tauri imports the certificate into a temporary keychain, signs the app
      # and its nested binaries with the hardened runtime, then notarizes and
      # staples it. Published only after every asset is uploaded, so
      # releases/latest never points at a release without latest.json.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --config src-tauri/tauri.bundle.json --config src-tauri/tauri.release.json
          tagName: ${{ github.ref_name }}
          releaseName: moonlet __VERSION__
          releaseBody: Apple Silicon build, signed with a Developer ID and notarized by Apple. Installed apps update themselves from Settings › Updates.
          releaseDraft: true
          prerelease: false

      # Tauri notarizes the app but only signs the DMG around it. A notarized,
      # stapled DMG passes Gatekeeper on its first open even offline.
      - name: Notarize the DMG
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          dmgs=(target/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ] || [ ! -f "${dmgs[0]}" ]; then
            echo "::error::expected one DMG, found: ${dmgs[*]}"
            exit 1
          fi
          out=$(xcrun notarytool submit "${dmgs[0]}" --wait \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" 2>&1)
          echo "$out"
          if ! grep -q "status: Accepted" <<<"$out"; then
            echo "::error::Apple did not accept the DMG; see the submission id above and run notarytool log"
            exit 1
          fi
          xcrun stapler staple "${dmgs[0]}"

      # Every binary must carry the team's signature and the hardened runtime,
      # and the app a user downloads, the DMG around it and the app inside the
      # update archive must be notarized. The notarization check asks codesign,
      # not spctl, because spctl accepts anything on a machine with Gatekeeper
      # turned off.
      - name: App is signed with the Developer ID and notarized
        env:
          TEAM_ID: LE9Q47C92D
        run: |
          app=target/release/bundle/macos/moonlet.app
          codesign --verify --deep --strict --verbose=2 "$app"
          for bin in "$app"/Contents/MacOS/*; do
            info=$(codesign -dv --verbose=2 "$bin" 2>&1 || true)
            if ! grep -q "TeamIdentifier=$TEAM_ID" <<<"$info"; then
              echo "::error::$bin is not signed by team $TEAM_ID"
              exit 1
            fi
            if ! grep -q "(runtime)" <<<"$info"; then
              echo "::error::$bin is not signed with the hardened runtime"
              exit 1
            fi
          done
          codesign --verify --check-notarization -R="notarized" --verbose=2 "$app"
          xcrun stapler validate "$app"
          update=$(mktemp -d)
          tar -xzf target/release/bundle/macos/*.app.tar.gz -C "$update"
          codesign --verify --deep --strict --check-notarization -R="notarized" --verbose=2 "$update/moonlet.app"
          for dmg in target/release/bundle/dmg/*.dmg; do
            codesign --verify --check-notarization -R="notarized" --verbose=2 "$dmg"
            xcrun stapler validate "$dmg"
          done

      # tauri-action uploaded the DMG before it was notarized; the stapled one
      # replaces it under the same name.
      - name: Upload the notarized DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" target/release/bundle/dmg/*.dmg --clobber
          count=$(gh release view "$GITHUB_REF_NAME" --json assets -q '[.assets[].name | select(endswith(".dmg"))] | length')
          if [ "$count" -ne 1 ]; then
            echo "::error::the release has $count DMGs, expected one"
            exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
